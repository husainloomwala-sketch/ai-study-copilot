services:
  - type: web
    name: ai-study-copilot
    runtime: node
    plan: starter
    buildCommand: "true"
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATA_FILE
        value: /data/db.json
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
